name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the vendored upstream tree
        run: node scripts/verify-upstream.mjs

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: The golden-master corpus
        run: node scripts/golden-master.mjs

      - name: The soak test
        run: node --expose-gc scripts/soak-server.mjs --batches 2000 --players 4

      - name: Build and validate the content bundle
        run: pnpm build:content

      - name: The content build is reproducible
        run: |
          # Two builds from the same inputs must produce the same build id.
          first=$(node packages/content/src/cli.ts | grep 'build id' | awk '{print $NF}')
          second=$(node packages/content/src/cli.ts | grep 'build id' | awk '{print $NF}')
          test "$first" = "$second"
          echo "content build is reproducible: $first"
