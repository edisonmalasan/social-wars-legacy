name: CI

# Every push and every pull request.
#
# The push trigger used to be `main` only, which meant a branch's own
# pipeline did not run until it was merged. Every push runs the whole
# gate now, so a branch is never green only because nobody looked.
on:
  push:
  pull_request:
  workflow_dispatch:

# One run at a time per branch: a second push supersedes the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the vendored upstream tree
        run: node scripts/verify-upstream.mjs

      # The content bundle comes **before** the tests: the rules and the
      # server are checked against the game's own configuration, so the
      # configuration has to exist before they are run.
      - name: Build and validate the content bundle
        run: pnpm build:content

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        # The type-check **and** the project's own rules: the client runs
        # in a browser, and a node: import in the graph it reaches is a
        # build failure at best.
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      # The coverage is **enforced**, not only reported: a number that
      # is only read is a number that quietly goes down.
      - name: The test coverage is above the floors
        run: node scripts/check-coverage.mjs

      - name: The golden-master corpus
        run: node scripts/golden-master.mjs

      - name: The soak test
        run: node --expose-gc scripts/soak-server.mjs --batches 2000 --players 4

      # The load test, and the **performance budgets** it is measured
      # against. The budgets are written down, so a failure says which
      # promise was broken.
      - name: The load test
        run: node scripts/load-test.mjs --players 8 --rounds 20

      - name: The content build is reproducible
        run: |
          # Two builds from the same inputs must produce the same build id.
          first=$(node packages/content/src/cli.ts | grep 'build id' | awk '{print $NF}')
          second=$(node packages/content/src/cli.ts | grep 'build id' | awk '{print $NF}')
          test "$first" = "$second"
          echo "content build is reproducible: $first"

      - name: The command catalogue agrees with the client
        run: node scripts/verify-command-catalogue.mjs

      # The roadmap is a list of items, and an item that is silently
      # swallowed is worse than one that is visibly unfinished. That
      # happened, so each group's item count is checked against a floor.
      - name: The roadmap has not lost an item
        run: node scripts/check-roadmap.mjs

      # The server's own check that it does not trust the client: eleven
      # attacks, each run against the real authority layer.
      - name: The cheat battery
        run: node scripts/run-cheat-battery.mjs

      # The shipped product has no Flash anywhere, and this proves it
      # rather than asserting it.
      - name: Nothing that ships needs Flash
        run: node scripts/check-no-flash.mjs

      # The licensing position's claims: the upstream is GPL v3 and
      # unmodified, no package imports from it, and the shipped tree
      # carries no Zynga media.
      - name: The licensing position holds
        run: node scripts/check-licensing.mjs

      # Every dependency's licence is **classified**, and one that is not
      # fails the build - so a new dependency has to be looked at before
      # it can be used.
      - name: The third-party licences are classified
        run: node scripts/build-licence-report.mjs --check

      # A decision without a rationale is a decision somebody will
      # quietly reverse.
      - name: The decision records are well formed
        run: node scripts/check-adrs.mjs

      # A review that points at a test which is not there is a review
      # that has drifted.
      - name: The security review's claims are covered
        run: node scripts/check-security-review.mjs

      # A promise nobody checks is a wish.
      - name: The corrections policy is in order
        run: node scripts/check-corrections.mjs

      # A checklist is a list of things to do at the worst possible
      # moment, so it is checked: every command it names exists, and the
      # whole gate is covered.
      - name: The release checklist is in order
        run: node scripts/check-release.mjs

      # The report set is the project's account of the original game, and
      # a number that has changed in the code but not in the report is a
      # lie waiting to be believed.
      - name: The report set agrees with the implementation
        run: node scripts/check-report-sync.mjs

  desktop:
    name: The desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The web view's system libraries. The shell is a web view, and a
      # web view needs them.
      - name: The web view's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri's build needs a `frontendDist` to exist before it will
      # compile, and a Windows build needs an `.ico`. This early pass
      # writes only the icons; the real client is copied once it is built.
      - name: The desktop shell's icons
        run: node scripts/prepare-desktop.mjs --icons-only

      # The content bundle the manifest is cut from, and the server's
      # own configuration.
      - name: Build the content bundle
        run: pnpm build:content

      # `tauri_build::build()` copies external binaries and resources at
      # COMPILE time, with no development guard. `cargo check/test` below
      # cannot compile on a fresh checkout unless the sidecar and its
      # runtime tree exist. The build needs the content bundle above and
      # the installed pnpm workspace (for PGlite).
      - name: Build the desktop server sidecar
        run: node scripts/build-desktop-server.mjs

      # The client's manifest is **measured and minimised**: the asset
      # pipeline's is 118 MB, and the browser cannot be sent that.
      - name: The client's manifest
        run: pnpm build:client

      # The web client is **one** client: the web build serves it, the
      # desktop shell wraps it in a web view, and the mobile build wraps
      # it in a WebView. So it has to build.
      - name: The web client builds
        run: pnpm --filter @swl/app-client build

      # The shell must ship the real client, not the placeholder. The
      # check fails if the copied page has no hashed module script.
      - name: The desktop shell's frontend
        run: |
          node scripts/prepare-desktop.mjs
          node scripts/check-desktop-dist.mjs

      # A build that produces different bytes each time cannot be
      # trusted: a release cannot be rebuilt and a change cannot be
      # reviewed by comparing the artefacts.
      - name: The web client's build is reproducible
        run: node scripts/check-reproducible-build.mjs

      # The client has to **run**, not merely build. The built client is
      # served and loaded in a real browser, and the page's own status is
      # read back over the DevTools protocol.
      - name: The web client starts in a browser
        run: node scripts/smoke-test-client.mjs

      # A **complete play session**, end to end: the real server, the real
      # client, a real browser. A player registers, signs in, plays, and
      # signs in again after a restart.
      - name: The end-to-end session
        run: node scripts/e2e-test.mjs

      - name: The desktop shell compiles
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: The desktop shell's tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: The shell is formatted
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

  # Unsigned Linux installers. This is a **separate, non-required** job on
  # purpose: bundling compiles a full release and downloads the AppImage
  # toolchain, and the four checks above must stay as fast as they are. It
  # reuses the same web-view libraries the desktop job already installs, and
  # nothing here signs, notarises or publishes anything - the two artefacts
  # are uploaded for inspection and labelled UNSIGNED.
  linux-bundle:
    name: Unsigned Linux bundles (informational)
    runs-on: ubuntu-latest
    # A bound, so a stuck bundle download cannot hold the run open all day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: dtolnay/rust-toolchain@stable

      # The same web-view libraries the desktop job installs. No new system
      # dependency is needed to produce a .deb or an .AppImage.
      - name: The web view's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same inputs the desktop job prepares, in the same order: the
      # content bundle, the server sidecar the shell bundles, and the real
      # client in `frontendDist` (the shell must not ship the placeholder).
      - name: Build the content bundle
        run: pnpm build:content

      - name: Build the desktop server sidecar
        run: node scripts/build-desktop-server.mjs

      - name: Build the client's manifest
        run: pnpm build:client

      - name: Build the web client
        run: pnpm --filter @swl/app-client build

      - name: Prepare the desktop shell
        run: node scripts/prepare-desktop.mjs

      - name: The shell's frontend is the real client
        run: node scripts/check-desktop-dist.mjs

      # Pinned to the npm Tauri CLI used for the Windows bundles. Only the
      # two Linux targets are requested; there is no signing identity, no
      # notarisation and no publisher credential anywhere in this job.
      - name: Build the unsigned .deb and .AppImage
        working-directory: apps/desktop/src-tauri
        run: npx --yes --package @tauri-apps/cli@2.12.3 tauri build --bundles deb,appimage

      - name: Confirm and label the unsigned bundles
        run: |
          set -eu
          deb=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          appimage=(apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          test -f "${deb[0]}"
          test -f "${appimage[0]}"
          echo "UNSIGNED Linux bundles (for inspection only):"
          echo "  deb:       ${deb[0]}"
          echo "  AppImage:  ${appimage[0]}"
          printf '%s\n' \
            'UNSIGNED - FOR INSPECTION ONLY' \
            'These Linux bundles carry no code signature and no notarisation,' \
            'and were not published to any repository or store.' \
            "deb: ${deb[0]}" \
            "AppImage: ${appimage[0]}" \
            > apps/desktop/src-tauri/target/release/bundle/UNSIGNED.txt

      - name: Upload the unsigned Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles-UNSIGNED
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/UNSIGNED.txt
          if-no-files-found: error
          retention-days: 7

  # The three jobs below are INFORMATIONAL. Free GitHub Actions macOS runners
  # let us compile and inspect Apple-platform artefacts, but nothing here
  # signs, notarises, publishes or submits anything, and no credential is
  # referenced. Every one has `continue-on-error: true` at the job level: the
  # four required checks above (Verify, desktop shell, Assets, Scan) and the
  # existing Linux bundle job are unchanged, and none of these attempts can
  # turn the workflow red.
  macos-bundle:
    name: Unsigned macOS app/dmg (informational)
    runs-on: macos-latest
    continue-on-error: true
    # A bound, so a stuck release compile cannot hold the run open all day.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same inputs, in the same order, as the desktop and Linux bundle
      # jobs: content, the server sidecar the shell bundles, the measured
      # client manifest and the real web client in `frontendDist`.
      - name: Build the content bundle
        run: pnpm build:content

      - name: Build the desktop server sidecar
        run: node scripts/build-desktop-server.mjs

      - name: Build the client's manifest
        run: pnpm build:client

      - name: Build the web client
        run: pnpm --filter @swl/app-client build

      - name: Prepare the desktop shell
        run: node scripts/prepare-desktop.mjs

      - name: The shell's frontend is the real client
        run: node scripts/check-desktop-dist.mjs

      # The same pinned npm Tauri CLI as the Windows/Linux bundles. macOS
      # needs no extra system library on the runner. No APPLE_SIGNING_IDENTITY,
      # APPLE_ID, APPLE_TEAM_ID or app-specific password is set anywhere, and
      # tauri.conf.json declares no signing identity: the result is an
      # unsigned, unnotarised .app and .dmg for inspection only.
      - name: Build the unsigned .app and .dmg
        working-directory: apps/desktop/src-tauri
        run: npx --yes --package @tauri-apps/cli@2.12.3 tauri build --bundles app,dmg

      - name: Confirm and label the unsigned macOS artefacts
        run: |
          set -eu
          bundle=apps/desktop/src-tauri/target/release/bundle
          app=( "$bundle"/macos/*.app )
          dmg=( "$bundle"/dmg/*.dmg )
          test -d "${app[0]}"
          test -f "${dmg[0]}"
          # `ditto` preserves the bundle structure (including symlinks) that a
          # plain directory upload would flatten.
          ditto -c -k --keepParent "${app[0]}" "$bundle/macos/UNSIGNED-app.zip"
          echo "UNSIGNED macOS artefacts (for inspection only):"
          echo "  app:  ${app[0]}"
          echo "  dmg:  ${dmg[0]}"
          printf '%s\n' \
            'UNSIGNED - FOR INSPECTION ONLY' \
            'These macOS artefacts carry no code signature and no notarisation,' \
            'and were not published, notarised or submitted to the App Store.' \
            "app: ${app[0]}" \
            "dmg: ${dmg[0]}" \
            > "$bundle/UNSIGNED.txt"

      - name: Upload the unsigned macOS artefacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles-UNSIGNED
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/UNSIGNED-app.zip
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/UNSIGNED.txt
          if-no-files-found: error
          retention-days: 7

  # An attempt to run the repository's existing WebKit browser session on a
  # macOS host. Playwright WebKit is an open-source engine, NOT branded Safari:
  # this job can only report what the script itself verifies and must never be
  # read as closing the branded-Safari gate. Kept non-required for that reason.
  safari-webkit:
    name: Safari / WebKit validation attempt (informational)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Python Playwright is a test tool these repository scripts already
      # require, not a dependency of the shipped client. Pin it to the exact
      # version the repository's verified WebKit session used, in a throwaway
      # venv so the runner's system Python is never modified.
      - name: Provision the pinned Playwright WebKit test tool
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/swl-playwright"
          "$RUNNER_TEMP/swl-playwright/bin/python" -m pip install --quiet playwright==1.60.0
          "$RUNNER_TEMP/swl-playwright/bin/python" -m playwright install webkit

      - name: Build the content bundle
        run: pnpm build:content

      - name: Build the web client
        run: pnpm --filter @swl/app-client build

      - name: Run the existing WebKit browser session script
        id: webkit_session
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          "$RUNNER_TEMP/swl-playwright/bin/python" scripts/e2e-test-webkit.py \
            --screenshot "$GITHUB_WORKSPACE/artifacts/swl-webkit-e2e.png"

      - name: Report exactly what this run verified
        if: always()
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          {
            echo 'Safari / WebKit validation attempt - INFORMATIONAL'
            echo "WebKit session outcome: ${{ steps.webkit_session.outcome }}"
            echo 'VERIFIED when the outcome is success (by scripts/e2e-test-webkit.py):'
            echo '  a full gameplay session through rendered controls against the real'
            echo '  authoritative server in headless Playwright WebKit: registration,'
            echo '  building, training, the weekly quest, reward, refused replay,'
            echo '  client reload and server restart.'
            echo 'NOT VERIFIED:'
            echo '  Branded Safari was NOT run. Headless WebKit is Playwright WebKit,'
            echo '  not Safari; no real device was used. A real Safari host remains a'
            echo '  separate gate and the G5 Safari checkbox stays open.'
          } | tee "$GITHUB_WORKSPACE/artifacts/WEBKIT-REPORT.txt"

      - name: Upload the WebKit proof and scope report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-session-INFORMATIONAL
          path: |
            artifacts/swl-webkit-e2e.png
            artifacts/WEBKIT-REPORT.txt
          if-no-files-found: warn
          retention-days: 7

  # An attempt at a Debug simulator build from the config-only mobile shell.
  # There is no committed native iOS project (see apps/mobile/README.md), so
  # the pinned Capacitor toolchain is installed in this ephemeral checkout and
  # `cap add ios` generates the project. No signing, no device and no App Store
  # build is attempted: success means a simulator .app was compiled, nothing
  # more. Kept non-required because the exact failure is an honest outcome.
  ios-simulator:
    name: iOS simulator build attempt (informational)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the content bundle
        run: pnpm build:content

      - name: Build the web client
        run: pnpm --filter @swl/app-client build

      - name: Validate the committed mobile configuration
        run: node scripts/check-mobile-config.mjs

      # The Capacitor 8.6.2 versions are the ones the repository's own README
      # records for its verified native build. They are build tools in this
      # temporary checkout, never a shipped or committed runtime dependency.
      - name: Provision the pinned Capacitor toolchain
        run: |
          set -eu
          pnpm --filter @swl/app-mobile add @capacitor/core@8.6.2 @capacitor/ios@8.6.2
          pnpm --filter @swl/app-mobile add -D @capacitor/cli@8.6.2

      - name: Sync the Capacitor client and add the iOS platform
        id: cap_sync
        run: |
          set -eu
          pnpm --filter @swl/app-mobile exec cap sync
          pnpm --filter @swl/app-mobile exec cap add ios

      - name: Build for the iOS simulator, unsigned
        id: xcode_build
        run: |
          set -eu
          cd apps/mobile/ios/App
          project=(-workspace App.xcworkspace)
          if [ ! -d App.xcworkspace ]; then project=(-project App.xcodeproj); fi
          xcodebuild "${project[@]}" -scheme App -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Report the iOS simulator outcome and stage any artefact
        if: always()
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          {
            echo 'iOS simulator build attempt - INFORMATIONAL'
            echo "cap sync/add ios: ${{ steps.cap_sync.outcome }}"
            echo "xcodebuild:       ${{ steps.xcode_build.outcome }}"
            echo 'No signing identity, provisioning profile or credential was used.'
            echo 'No device run and no App Store / distribution build was attempted.'
            echo 'server.url stays the documented placeholder, so no runtime load is claimed.'
            echo 'The exact failure, if any, is in the log of the failed step above.'
          } > "$GITHUB_WORKSPACE/artifacts/IOS-REPORT.txt"
          products="$RUNNER_TEMP/ios-derived-data/Build/Products/Debug-iphonesimulator"
          if [ -d "$products" ]; then
            app=""
            for candidate in "$products"/*.app; do
              if [ -d "$candidate" ]; then app="$candidate"; break; fi
            done
            if [ -n "$app" ]; then
              ditto -c -k --keepParent "$app" "$GITHUB_WORKSPACE/artifacts/ios-simulator-UNSIGNED.app.zip"
              echo "simulator .app: $app" >> "$GITHUB_WORKSPACE/artifacts/IOS-REPORT.txt"
            fi
          fi
          cat "$GITHUB_WORKSPACE/artifacts/IOS-REPORT.txt"

      - name: Upload the iOS simulator report and any artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-INFORMATIONAL
          path: |
            artifacts/ios-simulator-UNSIGNED.app.zip
            artifacts/IOS-REPORT.txt
          if-no-files-found: warn
          retention-days: 7

  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the content bundle
        run: pnpm build:content

      # The manifest reports both directions: what is referenced but
      # missing, and what is present but unreferenced. Either is a
      # failure, because the first is a broken image and the second is
      # weight the player downloads for nothing.
      - name: The asset manifest agrees with the tree
        run: node scripts/build-asset-manifest.mjs

  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The policy: a **high** or **critical** advisory fails the run, and
      # a moderate one does not. The rule is written down rather than
      # left to whatever the tool defaults to, because the default
      # changes.
      - name: The dependencies have no known vulnerability
        run: |
          pnpm audit --audit-level=high
          echo "the dependency scan passed: no high or critical advisory"

      - name: No credential is committed
        run: node --test packages/server/src/security.test.ts
