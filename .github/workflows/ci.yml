name: CI

# Every push and every pull request.
#
# The push trigger used to be `main` only, which meant a branch's own
# pipeline did not run until it was merged. Every push runs the whole
# gate now, so a branch is never green only because nobody looked.
on:
  push:
  pull_request:
  workflow_dispatch:

# One run at a time per branch: a second push supersedes the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the vendored upstream tree
        run: node scripts/verify-upstream.mjs

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        # The type-check **and** the project's own rules: the client runs
        # in a browser, and a node: import in the graph it reaches is a
        # build failure at best.
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      # The coverage is **enforced**, not only reported: a number that
      # is only read is a number that quietly goes down.
      - name: The test coverage is above the floors
        run: node scripts/check-coverage.mjs

      - name: The golden-master corpus
        run: node scripts/golden-master.mjs

      - name: The soak test
        run: node --expose-gc scripts/soak-server.mjs --batches 2000 --players 4

      # The load test, and the **performance budgets** it is measured
      # against. The budgets are written down, so a failure says which
      # promise was broken.
      - name: The load test
        run: node scripts/load-test.mjs --players 8 --rounds 20

      - name: Build and validate the content bundle
        run: pnpm build:content

      - name: The content build is reproducible
        run: |
          # Two builds from the same inputs must produce the same build id.
          first=$(node packages/content/src/cli.ts | grep 'build id' | awk '{print $NF}')
          second=$(node packages/content/src/cli.ts | grep 'build id' | awk '{print $NF}')
          test "$first" = "$second"
          echo "content build is reproducible: $first"

      - name: The command catalogue agrees with the client
        run: node scripts/verify-command-catalogue.mjs

      # The roadmap is a list of items, and an item that is silently
      # swallowed is worse than one that is visibly unfinished. That
      # happened, so each group's item count is checked against a floor.
      - name: The roadmap has not lost an item
        run: node scripts/check-roadmap.mjs

      # The server's own check that it does not trust the client: eleven
      # attacks, each run against the real authority layer.
      - name: The cheat battery
        run: node scripts/run-cheat-battery.mjs

      # The shipped product has no Flash anywhere, and this proves it
      # rather than asserting it.
      - name: Nothing that ships needs Flash
        run: node scripts/check-no-flash.mjs

      # The licensing position's claims: the upstream is GPL v3 and
      # unmodified, no package imports from it, and the shipped tree
      # carries no Zynga media.
      - name: The licensing position holds
        run: node scripts/check-licensing.mjs

      # Every dependency's licence is **classified**, and one that is not
      # fails the build - so a new dependency has to be looked at before
      # it can be used.
      - name: The third-party licences are classified
        run: node scripts/build-licence-report.mjs --check

      # A decision without a rationale is a decision somebody will
      # quietly reverse.
      - name: The decision records are well formed
        run: node scripts/check-adrs.mjs

      # A review that points at a test which is not there is a review
      # that has drifted.
      - name: The security review's claims are covered
        run: node scripts/check-security-review.mjs

      # A promise nobody checks is a wish.
      - name: The corrections policy is in order
        run: node scripts/check-corrections.mjs

      # A checklist is a list of things to do at the worst possible
      # moment, so it is checked: every command it names exists, and the
      # whole gate is covered.
      - name: The release checklist is in order
        run: node scripts/check-release.mjs

      # The report set is the project's account of the original game, and
      # a number that has changed in the code but not in the report is a
      # lie waiting to be believed.
      - name: The report set agrees with the implementation
        run: node scripts/check-report-sync.mjs

  desktop:
    name: The desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The web view's system libraries. The shell is a web view, and a
      # web view needs them.
      - name: The web view's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri's build needs a `frontendDist` to exist before it will
      # compile, and a Windows build needs an `.ico`. The script writes
      # both, and the icon is drawn rather than shipped as a binary.
      - name: The desktop shell's build inputs
        run: node scripts/prepare-desktop.mjs

      # The client's manifest is **measured and minimised**: the asset
      # pipeline's is 118 MB, and the browser cannot be sent that.
      - name: The client's manifest
        run: pnpm build:client

      # The web client is **one** client: the web build serves it, the
      # desktop shell wraps it in a web view, and the mobile build wraps
      # it in a WebView. So it has to build.
      - name: The web client builds
        run: pnpm --filter @swl/app-client build

      # A build that produces different bytes each time cannot be
      # trusted: a release cannot be rebuilt and a change cannot be
      # reviewed by comparing the artefacts.
      - name: The web client's build is reproducible
        run: node scripts/check-reproducible-build.mjs

      # The client has to **run**, not merely build. The built client is
      # served and loaded in a real browser, and the page's own status is
      # read back over the DevTools protocol.
      - name: The web client starts in a browser
        run: node scripts/smoke-test-client.mjs

      # A **complete play session**, end to end: the real server, the real
      # client, a real browser. A player registers, signs in, plays, and
      # signs in again after a restart.
      - name: The end-to-end session
        run: node scripts/e2e-test.mjs

      - name: The desktop shell compiles
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: The desktop shell's tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: The shell is formatted
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the content bundle
        run: pnpm build:content

      # The manifest reports both directions: what is referenced but
      # missing, and what is present but unreferenced. Either is a
      # failure, because the first is a broken image and the second is
      # weight the player downloads for nothing.
      - name: The asset manifest agrees with the tree
        run: node scripts/build-asset-manifest.mjs

  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The policy: a **high** or **critical** advisory fails the run, and
      # a moderate one does not. The rule is written down rather than
      # left to whatever the tool defaults to, because the default
      # changes.
      - name: The dependencies have no known vulnerability
        run: |
          pnpm audit --audit-level=high
          echo "the dependency scan passed: no high or critical advisory"

      - name: No credential is committed
        run: node --test packages/server/src/security.test.ts
