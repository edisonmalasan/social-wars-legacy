[package]
name = "social-wars-legacy"
version = "0.1.0"
description = "The Social Wars Legacy desktop shell"
authors = ["Social Wars Legacy"]
edition = "2021"
rust-version = "1.77"

[lib]
# The desktop shell is a library with a thin binary, so the whole thing
# can be tested.
name = "swl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The remote server's certificate is checked before the game connects, so
# the player is told which server they are playing against and that its
# certificate is genuine. `rustls` is pure Rust, so there is no OpenSSL
# to build, and the roots are the operating system's own.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
rustls-pki-types = "1"
# The fingerprint is the one thing a player can compare against the
# server's own answer, and `ring` is already in the tree: `rustls` uses
# it.
ring = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
