[package]
name = "social-wars-legacy"
version = "0.1.0"
description = "The Social Wars Legacy desktop shell"
authors = ["Social Wars Legacy"]
edition = "2021"
rust-version = "1.77"

[lib]
# The desktop shell is a library with a thin binary, so the whole thing
# can be tested.
name = "swl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
