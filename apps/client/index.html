<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Social Wars Legacy</title>
    <style>
      /*
       * The game was built for a 760 by 600 stage, and the layout is not
       * fluid. So the stage is a fixed size and it is **scaled** to fit
       * the window, rather than being reflowed: the alternative is a
       * game whose panels overlap.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10131a;
        overflow: hidden;
        font-family: 'Nunito', system-ui, sans-serif;
      }

      #stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 760px;
        height: 600px;
        transform-origin: center center;
        transform: translate(-50%, -50%) scale(1);
      }

      #game canvas {
        display: block;
      }

      /*
       * The interface is a layer above the game, and it is **sized by
       * the stage**: the panels are placed for a 760 by 600 stage, so
       * they scale with it.
       */
      #ui {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>
      <div id="ui"></div>
      <div id="status" data-state="loading">loading</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
